name: Build IdeaForge APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate PWA icons
        run: node scripts/gen-icons.mjs

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Apply branded icons + splash
        run: node scripts/apply-android-icons.mjs

      - name: Sync web assets
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ideaforge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to builds branch
        run: |
          set -e

          APK=android/app/build/outputs/apk/debug/app-debug.apk

          ls -la "$APK"
          cp "$APK" /tmp/ideaforge-debug.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git branch -D builds 2>/dev/null || true

          git checkout --orphan builds

          git rm -rf . > /dev/null 2>&1 || true

          cp /tmp/ideaforge-debug.apk ./ideaforge-debug.apk

          git add ideaforge-debug.apk

          git commit -m "APK build #$GITHUB_RUN_NUMBER ($GITHUB_SHA)"

          git push --force origin builds
