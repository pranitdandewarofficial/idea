[project]
name = "pranit-ai-city-backend"
version = "1.0.0"
description = "PRANIT AI CITY — autonomous AI company orchestrator (FastAPI backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "cryptography>=43",
  "python-multipart>=0.0.12",
  "websockets>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]
# Optional System-1 decision model (Convai Innovations "Laya").
# The Decision Service auto-detects these packages and uses them when present.
# They are optional: a deterministic local decision engine is the built-in fallback.
decisions = [
  "laya-mnn",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
