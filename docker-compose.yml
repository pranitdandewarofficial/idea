# Optional containerised run. The default and recommended way to run this product
# is ./scripts/dev.sh, because the whole point is local-first: agents execute real
# commands in real workspaces on your machine.
#
# What this compose file gives you:
#   - the API and the built UI in one network, nothing published except the UI
#   - named volumes so .data (SQLite + encrypted keys) and workspaces/ survive
#
# What it does NOT give you: a usable sandbox tier 2. Docker-in-Docker is not
# wired up, so keep PRANIT_SANDBOX_TIER=1 (subprocess sandbox with resource
# limits, path validation and a shell allowlist).
#
#   docker compose up --build
#   open http://localhost:5173
services:
  api:
    image: python:3.11-slim
    working_dir: /app/backend
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      # Bound to the container network; only the `web` service proxies to it.
      PRANIT_HOST: 0.0.0.0
      PRANIT_PORT: "8000"
      PRANIT_DATA_DIR: /app/.data
      PRANIT_WORKSPACES_DIR: /app/workspaces
      PRANIT_ZERO_SPEND: "true"
      PRANIT_SANDBOX_TIER: "1"
      PRANIT_AUTH_ENABLED: "true"
      PRANIT_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    volumes:
      - .:/app
      - pranit-data:/app/.data
      - pranit-workspaces:/app/workspaces
    # The API is deliberately NOT published to the host: the UI proxies to it.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: node:20-slim
    working_dir: /app/frontend
    command: >
      sh -c "npm install --no-audit --no-fund &&
             npx vite --host 0.0.0.0 --port 5173"
    environment:
      # Inside the compose network the API is reachable as http://api:8000.
      PRANIT_BACKEND: http://api:8000
      PORT: "5173"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pranit-data:
  pranit-workspaces:
